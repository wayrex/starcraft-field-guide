  <style>text{font-family:Arial,sans-serif;fill:#182635} .minor{fill:#4e5e6b;font-size:12px} .label{font-size:14px;text-anchor:middle} .axis{font-size:12px;text-anchor:middle;fill:#4e5e6b}</style>
  <text x="28" y="28" font-size="20">Cargo yard + Grass</text>
  <text x="28" y="48" class="minor">36 x 36 inches | Frontlines objective mission | Updated 2026-11-17</text>
