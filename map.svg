<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 850" width="700" height="850" role="img" aria-labelledby="title desc">
  <title id="title">Cargo-yard map: 36 by 36 inches</title>
  <desc id="desc">Official 36 by 36 inch battlefield with custom first-game placement. Ten terrain pieces: two Size 3 mirrored tall walls, two Size 2 containers, two Size 2 cardboard corners, two Size 1 barricades and two removable Size 2 Grass clumps. Objectives 1, 5 and 2 are at (7,18), (18,18), (29,18) inches. Grass circles mark centres only; actual footprints and physical fit are unverified. All battlefield coordinates are inches. Specified base and marker diameters remain in mm.</desc>
